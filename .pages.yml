media:
  input: content/images
  output: /images

content:
  - name: signets
    label: Signets
    type: collection
    path: content/signets
    exclude: [_index.md]
    view:
      fields: [title, taxonomies.category, taxonomies.tags]
    actions:
      - name: vignette
        label: Récupérer la vignette
        scope: entry
        workflow: vignette.yml
        ref: current
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: extra
        type: object
        label: Lien et dossiers
        fields:
          - name: url
            label: URL
            type: string
            required: true
            pattern: ^https?://
          - name: image
            label: Image (vignette)
            type: image
          - name: dossiers
            label: Grands dossiers
            description: "En plus de ceux déduits des étiquettes (config.toml)."
            type: select
            options:
              multiple: true
              values:
                - { name: developpement, label: Développement web }
                - { name: design, label: Design et interfaces }
                - { name: accessibilite, label: Accessibilité et design inclusif }
                - { name: backend, label: Back-end et langages }
                - { name: qualite, label: Qualité, architecture et Git }
                - { name: ecoconception, label: Éco-conception et hébergement }
                - { name: securite, label: Cybersécurité }
                - { name: ia, label: Intelligence artificielle }
                - { name: libre, label: Open source et communautés }
                - { name: femmes-tech, label: Femmes dans la tech }
                - { name: parcours, label: Personnalités, pédagogie et carrière }
                - { name: societe, label: Tech et société }
      - name: taxonomies
        type: object
        label: Classement
        fields:
          - name: category
            label: Catégorie
            type: select
            options:
              multiple: true
              values:
                - { name: developpement, label: Développement }
                - { name: design, label: Design }
                - { name: ressources, label: Ressources }
                - { name: francophone, label: Francophone }
          - name: tags
            label: Étiquettes
            type: select
            description: "Courtes, en minuscules, sans accents."
            options:
              multiple: true
              values: [accessibilite, actu-tech, animation, api, architecture, auto-hebergement, backend, blog, carriere, collaboration, communaute, conventions, css, cybersecurite, dataviz, design, design-system, design-tokens, developpement, eco-conception, femmes-tech, git, go, ia, illustration, interface, java, javascript, linux, lisibilite, live-coding, markdown, media, musique, newsletter, nodejs, open-source, pedagogie, personnalite, php, podcast, presentation, qualite-architecture, recherche, site-statique, standards, tech-societe, terminal, twitch, typographie, ui, versionnement, video, web, web-components, web-standards]
      - name: body
        label: Pourquoi conserver ce lien
        type: rich-text
